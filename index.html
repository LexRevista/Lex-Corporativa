<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lex Corporativa</title>

    <!-- Tipografía Cinzel -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <img src="images/logo1.png" alt="Logo 1">
            <img src="images/logo2.png" alt="Logo 2">
            <h1>Lex Corporativa</h1>
        </div>
    </header>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="menu">
        <a href="#">Repositorio</a>
        <a href="#">Nosotros</a>
        <a href="#">Noticias</a>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <section class="noticias-barra">
            <div class="noticia">
                <h2>Primera noticia de ejemplo</h2>
                <p>Este es un resumen breve de la noticia, solo como ejemplo de cómo se verá en la barra.</p>
                <span class="fecha">18/10/2025</span>
            </div>
            <div class="noticia">
                <h2>Segunda noticia de ejemplo</h2>
                <p>Otro resumen breve, para mostrar el diseño de varias noticias en la barra.</p>
                <span class="fecha">17/10/2025</span>
            </div>
        </section>
    </main>

</body>
</html>
